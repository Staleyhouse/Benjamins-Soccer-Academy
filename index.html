<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Academy">
<title>Benjamin's First Team Academy · V12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Liverpool-inspired palette: rich red, deep red, cream, gold, and a touch of crest green for successful progress states. */
  --red:#c8102e; --red-deep:#8f0a1f; --red-soft:#fde7eb;
  --night:#14171d; --chalk:#f6f1e8; --card:#fffdf9; --line:#ddd5c8; --soft:#5d6068;
  --gold:#d4a017; --gold-deep:#9a6b00; --teal:#1a7f5a; --teal-deep:#0f5b40; --teal-soft:#ddf2e8;
  --cream:#fff7ea; --lfc-green:#0f5b40;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--chalk);color:var(--night);font-family:var(--body);font-size:17px;line-height:1.4;display:flex;flex-direction:column;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,.dsp{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.3px;margin:0;line-height:1.02;text-wrap:balance}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
p{margin:0}

/* banner + tabs */
.top{background:linear-gradient(135deg,var(--red) 0%,var(--red-deep) 100%);color:#fff;display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,28px);flex:none;position:relative;overflow:hidden}
.top::before{pointer-events:none;content:"";position:absolute;left:-20px;bottom:-52px;width:220px;height:110px;border:3px solid rgba(255,255,255,.12);border-top-left-radius:110px;border-top-right-radius:110px;border-bottom:0;opacity:.7}
.top::after{pointer-events:none;content:"";position:absolute;right:-40px;top:-60px;width:220px;height:220px;border:26px solid rgba(255,255,255,.08);border-radius:50%}
.top h1{font-size:30px;flex:1;min-width:0}
.top h1 small{display:block;font-family:var(--body);font-style:normal;font-weight:500;text-transform:none;font-size:14px;letter-spacing:0;opacity:.85;margin-top:3px}
.pill{background:rgba(0,0,0,.22);border-radius:99px;padding:6px 14px;font-weight:600;font-size:15px;display:flex;gap:7px;align-items:center;white-space:nowrap;position:relative;z-index:1}
.pill b{font-family:var(--display);font-size:21px;font-weight:700}
.lock{width:44px;height:44px;border-radius:12px;background:rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.lock svg{width:22px;height:22px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px clamp(14px,3vw,28px) 30px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabs{flex:none;background:var(--lfc-green);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{color:#e8f4ef;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 5px;border-radius:12px;font-size:13px;font-weight:600}
.tab svg{width:26px;height:26px}
.tab.on{background:var(--red);color:#fff}

/* building blocks */
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px}
.card h2{font-size:24px}
.card h3{font-size:20px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.soft{color:var(--soft)} .small{font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font-weight:700;font-size:17px;background:var(--night);color:#fff;text-align:center}
.btn.red{background:var(--red)} .btn.gold{background:var(--gold);color:#3b2900} .btn.teal{background:var(--teal-deep)}
.btn.ghost{background:#e8eae4;color:var(--night)} .btn.big{min-height:62px;font-size:20px;border-radius:16px}
.btn.wide{width:100%} .btn[disabled]{opacity:.4}
.btn:active{transform:translateY(1px)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 11px;font-size:13.5px;font-weight:600;background:#e8eae4;color:var(--night);white-space:nowrap}
.chip.pass{background:var(--teal-soft);color:var(--teal-deep)} .chip.next{background:var(--red-soft);color:var(--red-deep)} .chip.gold{background:#fdefc8;color:#6b4a00}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.bar{height:12px;border-radius:99px;background:#e3e6dd;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--red)}
.bar.gold i{background:var(--gold)} .bar.teal i{background:var(--teal)}

/* home */
.hero{background:linear-gradient(135deg,var(--night) 0%,#222733 42%,var(--red-deep) 100%);color:#fff;border-radius:22px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::before{pointer-events:none;content:"";position:absolute;left:-30px;right:-30px;bottom:-70px;height:120px;border:3px solid rgba(255,255,255,.07);border-radius:50%}
.hero::after{pointer-events:none;content:"";position:absolute;right:16px;top:14px;width:120px;height:66px;border:3px solid rgba(255,255,255,.12);border-top-left-radius:66px;border-top-right-radius:66px;border-bottom:0;opacity:.9}
.hero h2{font-size:34px}
.hero .ring{width:132px;height:132px;position:relative;flex:none}
.hero .ring svg{width:100%;height:100%}
.hero .ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hero .ring b{font-family:var(--display);font-size:46px;font-weight:700}
.hero .ring span{font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.8}
.hero .tests{display:flex;gap:5px;margin:10px 0 12px;flex-wrap:wrap}
.hero .tests i{width:26px;height:10px;border-radius:99px;background:rgba(255,255,255,.18)}
.hero .tests i.f{background:var(--teal)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.kpi b{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;display:block}
.kpi span{font-size:13.5px;color:var(--soft)}
.week{display:flex;gap:6px;margin-top:8px}
.week i{flex:1;height:30px;border-radius:8px;background:#e3e6dd;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:var(--soft)}
.week i.f{background:var(--teal);color:#fff} .week i.t{box-shadow:inset 0 0 0 2px var(--night)}

/* lists */
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.item .ico{width:46px;height:46px;border-radius:12px;background:var(--red-soft);color:var(--red-deep);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:22px;flex:none}
.item.done .ico{background:var(--teal);color:#fff}
.item b{display:block;font-size:17.5px;font-weight:700;line-height:1.2}
.item .meta{font-size:14px;color:var(--soft)}
.item .go{font-family:var(--display);font-weight:700;font-size:20px;color:var(--red);flex:none}
.sect{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.sect h2{font-size:26px}
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border-radius:99px;padding:8px 16px;background:#e3e6dd;font-weight:600;font-size:15px}
.filter button.on{background:var(--night);color:#fff}

/* benchmarks */
.steps10{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.steps10 button{border-radius:12px;padding:8px 0 6px;background:#e3e6dd;display:flex;flex-direction:column;align-items:center;line-height:1}
.steps10 b{font-family:var(--display);font-size:24px;font-weight:700}
.steps10 span{font-size:11px;font-weight:600;color:var(--soft);margin-top:2px}
.steps10 .done{background:var(--teal);color:#fff} .steps10 .done span{color:#d7f5f2}
.steps10 .cur{background:var(--red);color:#fff} .steps10 .cur span{color:#ffd9df}
.steps10 .view{box-shadow:0 0 0 3px var(--night)}
.steps10 button{position:relative;min-height:108px;justify-content:flex-start;padding-top:6px}
.bgate{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.bgate svg{display:block;width:58px;height:52px;overflow:visible}
.bgate .g-pill{fill:rgba(255,255,255,.18)}
.bgate .g-post,.bgate .g-arch,.bgate .g-crown{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bgate .g-num{font-family:var(--display);font-size:19px;font-weight:700;fill:currentColor}
.bgate .g-ynwa{font-family:var(--body);font-size:4.7px;font-weight:700;letter-spacing:.5px;fill:currentColor}
.bgate .g-age{font-size:10px;font-weight:700;color:inherit;opacity:.82;letter-spacing:.2px}
.bgate .g-name{font-size:9.5px;font-weight:600;color:inherit;opacity:.65;line-height:1.05;max-width:58px;text-wrap:balance}
.lfc-note{background:linear-gradient(135deg,var(--red-soft) 0%, #fff7ea 100%);border:2px solid #edcbd2;border-radius:18px;padding:14px 16px;position:relative;overflow:hidden}
.lfc-note::after{content:"";position:absolute;right:-18px;bottom:-20px;width:86px;height:44px;border:3px solid rgba(200,16,46,.18);border-top-left-radius:44px;border-top-right-radius:44px;border-bottom:0}
.clubline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.clubchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:#fff;border:1.5px solid #edd9ad;font-size:13px;font-weight:700;color:var(--night)}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.trow .tg{text-align:right;line-height:1.1}
.trow .tg b{font-family:var(--display);font-size:26px;font-weight:700}
.trow .tg span{display:block;font-size:12px;color:var(--soft)}
.lvbar{display:flex;gap:3px;margin-top:6px}
.lvbar i{width:16px;height:6px;border-radius:9px;background:#e3e6dd}
.lvbar i.f{background:var(--teal)} .lvbar i.t{background:var(--red)}

/* rewards */
.rw{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.rw .em{width:62px;height:62px;border-radius:16px;background:#eef0ea;display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
.rw.locked .em{filter:grayscale(1);opacity:.55}
.rw.ready{border-color:var(--gold-deep);background:#fff8e3;box-shadow:0 4px 0 var(--gold)}
.rw.given{opacity:.7}
.rw b{font-size:19px;display:block;line-height:1.2}

/* player card */
.pc{background:linear-gradient(160deg,var(--red) 0%,var(--red-deep) 100%);color:#fff;border-radius:24px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;overflow:hidden}
.pc::after{content:"";position:absolute;right:-50px;bottom:-90px;width:260px;height:260px;border:30px solid rgba(255,255,255,.07);border-radius:50%}
.pc .ovr{font-family:var(--display);font-weight:700;font-size:92px;line-height:.85}
.pc .ovr small{display:block;font-size:16px;letter-spacing:2px;opacity:.85;margin-top:8px}
.pc h2{font-size:40px}
.radar text{font-family:var(--display);font-weight:700;font-size:13px;fill:var(--night)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{border-radius:14px;padding:10px 12px;background:#e8eae4;color:var(--soft);font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:center}
.bdg::before{content:"";width:22px;height:22px;border-radius:50%;background:#cfd3c9;flex:none}
.bdg.on{background:#fdefc8;color:#4b3500} .bdg.on::before{background:var(--gold);box-shadow:inset 0 0 0 4px #fff3cf}

/* full-screen sheets */
.sheet{position:fixed;inset:0;background:var(--chalk);z-index:10;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .head{background:var(--night);color:#fff;display:flex;align-items:center;gap:12px;padding:10px clamp(14px,3vw,28px);flex:none}
.sheet .head h2{font-size:26px;flex:1;min-width:0}
.sheet .body{flex:1;overflow-y:auto;padding:16px clamp(14px,3vw,28px) 28px}
.x{height:44px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:700}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
ol.how{margin:6px 0 0;padding-left:22px} ol.how li{margin:5px 0}
ul.tips{margin:6px 0 0;padding:0;list-style:none} ul.tips li{padding:6px 0 6px 28px;position:relative}
ul.tips li::before{content:"";position:absolute;left:4px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--teal)}
ul.tips.fix li::before{background:var(--red)}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
label.btn{position:relative;cursor:pointer}
.dia{background:#2f7d4f;border-radius:14px;overflow:hidden}
.dia svg{display:block;width:100%}
.style{background:var(--red-soft);border-radius:12px;padding:10px 12px;color:var(--red-deep);font-weight:500;font-size:15.5px}

/* timer */
.clock{text-align:center;padding:10px 0}
.clock .ph{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;text-transform:uppercase}
.clock .t{font-family:var(--display);font-weight:700;font-size:150px;line-height:.95;font-variant-numeric:tabular-nums}
.clock.rest .t{color:var(--teal-deep)} .clock.work .t{color:var(--red)}
.clock .now{font-size:21px;font-weight:600;min-height:30px}
.sets{display:flex;gap:6px;justify-content:center;margin:10px 0 14px}
.sets i{width:26px;height:10px;border-radius:99px;background:#dfe2da} .sets i.f{background:var(--teal)} .sets i.c{background:var(--red)}

/* real footage and fair video review */
.lesson{width:100%}.lesson-video{position:relative;width:100%;aspect-ratio:16/9;background:#151b22;border-radius:14px;overflow:hidden}
.lesson-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.grade-meter{height:14px;overflow:hidden;border-radius:99px;background:#dde2db;margin:10px 0}
.grade-meter i{display:block;height:100%;background:var(--teal);border-radius:99px}
.grade-meter i.near{background:var(--gold-deep)}
.grade-meter i.low{background:var(--red)}
.grade-value{font-family:var(--display);font-size:74px;font-weight:800;line-height:1}
.rubric{display:grid;gap:9px;margin-top:12px}.rubric-item{background:#f2f4ef;border-radius:13px;padding:10px}
.rubric-item strong{display:block;font-size:14px;margin-bottom:6px}.rubric-item select{width:100%;min-height:44px;border:2px solid var(--line);background:#fff;border-radius:8px;padding:5px;font-size:15px}
.grade-note{font-size:13px;color:var(--soft);margin-top:9px}
/* video review */
.rv{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.vbox{background:#000;border-radius:16px;overflow:hidden}
.vbox video{display:block;width:100%;max-height:52vh;background:#000}
.vctl{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.vctl button{min-height:46px;border-radius:10px;background:#e3e6dd;font-weight:700;font-size:14.5px}
.vctl .play{background:var(--night);color:#fff}
input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--red);height:28px}
.count{font-family:var(--display);font-weight:700;font-size:120px;line-height:.9;text-align:center;font-variant-numeric:tabular-nums}
.tap{width:100%;min-height:150px;border-radius:22px;background:var(--red);color:#fff;font-family:var(--display);font-style:italic;font-weight:800;font-size:54px;text-transform:uppercase;box-shadow:0 8px 0 var(--red-deep)}
.tap:active{transform:translateY(5px);box-shadow:0 3px 0 var(--red-deep)}
.tap.good{background:var(--teal);box-shadow:0 8px 0 var(--teal-deep);font-size:38px;min-height:110px}
.tap.miss{background:#6b7078;box-shadow:0 8px 0 #474b52;font-size:38px;min-height:110px}
.verdict{border-radius:20px;padding:22px;text-align:center;color:#fff}
.verdict.pass{background:var(--teal-deep)} .verdict.fail{background:var(--night)}
.verdict h2{font-size:44px}
.verdict .sc{font-family:var(--display);font-weight:700;font-size:74px;line-height:1}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--soft)}
.field input,.field select{height:46px;border-radius:10px;border:2px solid var(--line);padding:0 10px;font-size:16px;font-weight:500;color:var(--night);background:#fff;min-width:0}
table.tg{border-collapse:collapse;width:100%;font-size:14px}
table.tg th,table.tg td{padding:4px;text-align:center}
table.tg th:first-child,table.tg td:first-child{text-align:left;font-weight:600;white-space:nowrap}
table.tg input{width:54px;height:36px;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:14px;background:#fff}
.scrollx{overflow-x:auto}

.veil{position:fixed;inset:0;background:rgba(20,22,28,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.veil.on{display:flex}
.dlg{background:#fff;border-radius:22px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h3{font-size:30px}
.dlg input{height:54px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font-size:20px;width:100%;background:#fff}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--night);color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.party{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.party i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@media (prefers-reduced-motion:reduce){.party i{display:none}.toast{transition:none}}
@media (max-width:760px){.grid2,.two,.rv{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.steps10{grid-template-columns:repeat(5,1fr)}.clock .t{font-size:110px}.top h1 small{display:none}.kpis{grid-template-columns:1fr 1fr 1fr}}

/* V8 uninterrupted session recording: on-screen coaching and camera in two panes. */
.cont-panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.cont-shell{display:grid;grid-template-columns:minmax(250px,1.08fr) minmax(280px,.92fr);gap:14px;align-items:start}
.cont-camera{position:relative;overflow:hidden;border-radius:14px;background:#101318;min-height:250px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#fff}
.cont-camera video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transform:none}
.cont-camera .cam-placeholder{padding:20px;text-align:center;max-width:280px}
.cont-reclabel{position:absolute;top:10px;left:10px;z-index:1;background:#c8102e;color:#fff;padding:7px 11px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.4px}
.cont-reclabel i{display:inline-block;width:9px;height:9px;border-radius:50%;background:white;margin-right:6px;animation:recdot 1.3s infinite}
@keyframes recdot{50%{opacity:.32}}
.cont-recclock{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;font-weight:800;text-shadow:0 2px 8px #000;background:#0009;border-radius:9px;padding:5px;font-variant-numeric:tabular-nums}
.cont-countdown{position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(11,22,19,.86);color:white;border:3px solid var(--gold);border-radius:22px;min-width:150px;padding:12px 18px;text-align:center;pointer-events:none;box-shadow:0 8px 22px #0008}
.cont-countdown[hidden]{display:none}
.cont-countdown strong{display:block;color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:1px;line-height:1.2}
.cont-countdown b{font-family:var(--display);font-size:80px;line-height:.96;font-weight:800;font-variant-numeric:tabular-nums}
.cont-phase.ready{background:var(--teal-deep)}
.cont-phase.ready b{color:var(--gold)}
.cont-phase.work{background:var(--red-deep)}
.cont-camflip{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:10px 0 0;flex-wrap:wrap}
.cont-camflip .btn{min-height:44px}

.cont-instructions{display:flex;flex-direction:column;gap:9px}
.cont-instructions ol{margin:4px 0 0;padding-left:22px}
.cont-instructions li{margin-bottom:7px;line-height:1.36}
.cont-instructions .cont-tag{background:var(--red-soft);color:var(--red-deep);font-size:12px;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:999px;align-self:start}
.cont-phase{background:var(--night);color:#fff;padding:12px 14px;border-radius:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cont-phase strong{font-family:var(--display);font-size:30px;line-height:1}
.cont-phase b{font-family:var(--display);font-size:43px;line-height:1;font-variant-numeric:tabular-nums}
.cont-progress{height:9px;border-radius:99px;background:#e7e1d6;overflow:hidden}
.cont-progress i{display:block;height:100%;width:0%;background:var(--red);transition:width .2s}
.cont-stage-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.cont-stage-list span{font-size:12px;border-radius:7px;padding:5px 8px;background:#efeae3;font-weight:700}
.cont-stage-list span.now{background:var(--red);color:#fff}
.cont-stage-list span.done{background:var(--teal);color:#fff}
.cont-actions{display:flex;gap:9px;flex-wrap:wrap}
.cont-actions .btn{flex:1;min-width:140px}
.cont-warning{font-size:13.5px;color:var(--soft);line-height:1.45}
@media(max-width:750px){.cont-shell{grid-template-columns:1fr}.cont-camera{aspect-ratio:16/10;min-height:175px}.cont-panel{padding:11px}.cont-instructions{gap:6px}.cont-instructions li{margin-bottom:5px}.cont-phase strong{font-size:25px}.cont-phase b{font-size:34px}}

/* Parent review tools — child-facing app appearance is unchanged. */
.admin-review video{width:100%;max-height:38vh;border-radius:12px;background:#14171d;display:block}
.admin-review .field{margin-top:11px}
.admin-review .field input,.admin-review .field select,.admin-review textarea{width:100%}
.admin-review textarea{resize:vertical;min-height:82px;border:2px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--night)}
.admin-meta{font-size:13px;color:var(--soft);overflow-wrap:anywhere}
.admin-note{background:#fff6e4;border:1.5px solid #efd7a5;border-radius:12px;padding:11px;margin-top:11px;font-size:14px}
.admin-audit{padding:10px 0;border-bottom:1px solid var(--line)}
.admin-audit:last-child{border:0}
[hidden]{display:none!important}
</style>

  function mergeBackups(old,incoming){
    var out=JSON.parse(JSON.stringify(old));
    out.xp=Math.max(+old.xp||0,+incoming.xp||0);
    F.A.TESTS.forEach(function(t){var a=(out.tests||{})[t.id],b=(incoming.tests||{})[t.id];if(b&&a){if((b.lvl||0)>(a.lvl||0))out.tests[t.id]=b;}});
    out.trainingByBench=out.trainingByBench||{};
    Object.keys(incoming.trainingByBench||{}).forEach(function(k){out.trainingByBench[k]=Math.max(+out.trainingByBench[k]||0,+incoming.trainingByBench[k]||0);});
    out.bonusAwards=Object.assign({},incoming.bonusAwards||{},out.bonusAwards||{});
    out.days=Array.from(new Set((old.days||[]).concat(incoming.days||[]))).sort();
    function dedup(a,b,key){var seen=new Set();return a.concat(b).filter(function(x){if(!x||typeof x!=='object')return false;var v=key(x);if(seen.has(v))return false;seen.add(v);return true;});}
    out.trainingSessions=dedup(old.trainingSessions||[],incoming.trainingSessions||[],function(x){return x.videoHash||[x.date,x.bench,(x.ids||[]).join(','),x.xp].join(':');});
    out.log=dedup(old.log||[],incoming.log||[],function(x){return [x.t,x.test,x.at,x.score,x.grade].join(':');}).sort(function(a,b){return (b.t||0)-(a.t||0);}).slice(0,300);
    out.adminAudit=dedup(old.adminAudit||[],incoming.adminAudit||[],function(x){return JSON.stringify(x);}).slice(-200);
    out.videoProofs=dedup(old.videoProofs||[],incoming.videoProofs||[],function(x){return typeof x==='string'?x:JSON.stringify(x);});
    out.benchmarkVideoProofs=dedup(old.benchmarkVideoProofs||[],incoming.benchmarkVideoProofs||[],function(x){return [x.hash,x.test,x.stage].join(':');});
    out.badges=Object.assign({},incoming.badges||{},old.badges||{});
    out.missions=Object.assign({},incoming.missions||{},old.missions||{});
    out.drills=Math.max(+old.drills||0,+incoming.drills||0);
    out.bestWeeks=Math.max(+old.bestWeeks||0,+incoming.bestWeeks||0);
    // Do not merge partially completed same-day sessions across two copies.
    if((incoming.today||{}).date>(old.today||{}).date)out.today=incoming.today;
    if(!out.pendingTraining&&incoming.pendingTraining)out.pendingTraining=incoming.pendingTraining;
    out.updated=Date.now();
    return out;
  }

    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tg]'), function (inp) {
      inp.onchange = function () { var id = inp.dataset.tg, arr = S.config.targets[id] || A.test[id].targets.slice(), v = parseFloat(inp.value); if (!isFinite(v) || v <= 0) { inp.value = F.target(id, +inp.dataset.l); return; } arr[+inp.dataset.l - 1] = v; S.config.targets[id] = arr; saveC(); };
    });
    if ($('tg-reset')) $('tg-reset').onclick = function () { S.config.targets = {}; saveC(); panel(); };
    if ($('s-name')) $('s-name').onchange = function () { S.config.name = this.value.trim() || 'Player'; saveC(); };
    if ($('s-sound')) $('s-sound').onchange = function () { S.config.sound = this.checked; saveC(); };
    if ($('s-reset')) $('s-reset').onclick = function () {
      F.ask({ title: 'Reset all progress?', text: 'Type RESET to confirm. This cannot be undone.', input: { ph: 'RESET' }, buttons: [{ label: 'Reset', kind: 'red', v: 1 }, { label: 'Cancel', v: 0 }] }).then(function (r) {
        if (r.v && r.text.trim().toUpperCase() === 'RESET') { S.progress = F.fixProgress(null); F.save(F.KP); F.render(); F.toast('Progress reset.'); panel(); }
      });
    };
  }
  $('b-parent').onclick = unlock;

  /* ---------- start ---------- */
  F.render();
  F.ready.then(function () { return F.pull(); }).then(function (changed) { if (changed) F.render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !$('sheet').classList.contains('on')) F.pull().then(function (ch) { if (ch) F.render(); }); });
})();

</script>
</body>
</html>
